# Единый стенд «магазин цветов»: семь живых уровней + самооптимизирующийся роутер
# перед ними + AI-слой (витрина / управляющий / поиск) поверх роутера.
#
# Каждый сервис собирается из своей ветки-первоисточника (git build-context),
# поэтому дублирования кода нет — этот файл и есть точка сборки всей системы.
#
# Профили:
#   (по умолчанию)  L1–L5 + роутер + витрина + управляющий + поиск
#   --profile full        добавляет L6 (Next.js + PostgreSQL + сид)
#   --profile enterprise  добавляет L7 (микросервисы + RabbitMQ + PostgreSQL + nginx)
#   --profile commerce    добавляет общие сервисы auth + payment
#
# REPO можно переопределить (напр. на локальный форк); по умолчанию — GitHub.
# ANTHROPIC_API_KEY (необязательно) включает LLM-движки; без него — детерминированные.

x-repo: &repo ${REPO:-https://github.com/svend4/daten2.git}

services:
  # ======================= ЖИВЫЕ УРОВНИ (L1–L5) =======================
  level1:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level1-php-GBpVR
    ports: ["8081:80"]

  level2:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level2-flask-GBpVR
    ports: ["8082:10000"]

  level3:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level3-django-GBpVR
    environment:
      PORT: "10000"
    ports: ["8083:10000"]

  level4:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level4-express-GBpVR
    environment:
      PORT: "10000"
    ports: ["8084:10000"]

  level5:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level5-react-flask-GBpVR
    ports: ["8085:10000"]

  # ======================= L6 (профиль full) =======================
  l6-db:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: flower
      POSTGRES_PASSWORD: flower
      POSTGRES_DB: flower_shop
    volumes: ["l6-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower"]
      interval: 5s
      timeout: 3s
      retries: 10

  l6-seed:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level6-nextjs-GBpVR
      target: builder
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://flower:flower@l6-db:5432/flower_shop?schema=public
    command: sh -c "npx prisma db push --accept-data-loss --skip-generate && npx tsx prisma/seed.ts"
    restart: "no"
    depends_on:
      l6-db:
        condition: service_healthy

  level6:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level6-nextjs-GBpVR
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://flower:flower@l6-db:5432/flower_shop?schema=public
      PORT: "10000"
    ports: ["8086:10000"]
    depends_on:
      l6-db:
        condition: service_healthy
      l6-seed:
        condition: service_completed_successfully

  # ======================= L7 (профиль enterprise) =======================
  l7-postgres:
    image: postgres:15-alpine
    profiles: ["enterprise"]
    environment:
      POSTGRES_DB: flower_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - l7-data:/var/lib/postgresql/data
      - ./stack/level7/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  l7-rabbitmq:
    image: rabbitmq:3-management-alpine
    profiles: ["enterprise"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  product-service:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level7-enterprise-GBpVR:services/product-service
    profiles: ["enterprise"]
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@l7-postgres:5432/flower_shop
    depends_on:
      l7-postgres:
        condition: service_healthy

  order-service:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level7-enterprise-GBpVR:services/order-service
    profiles: ["enterprise"]
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://postgres:postgres@l7-postgres:5432/flower_shop
      RABBITMQ_URL: amqp://guest:guest@l7-rabbitmq:5672
    depends_on:
      l7-postgres:
        condition: service_healthy
      l7-rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/level7-enterprise-GBpVR:services/notification-service
    profiles: ["enterprise"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@l7-rabbitmq:5672
    depends_on:
      l7-rabbitmq:
        condition: service_healthy

  level7:
    image: nginx:alpine
    profiles: ["enterprise"]
    volumes:
      - ./stack/level7/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8087:80"]
    depends_on:
      - product-service
      - order-service

  # ======================= САМООПТИМИЗИРУЮЩИЙСЯ РОУТЕР =======================
  router:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/ai-router-GBpVR
    environment:
      HEALTH_MS: "5000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ROUTER_BACKENDS: >-
        [{"id":"level1","name":"PHP (L1)","url":"http://level1:80","cost":1},
         {"id":"level2","name":"Flask (L2)","url":"http://level2:10000","cost":1},
         {"id":"level3","name":"Django (L3)","url":"http://level3:10000","cost":2},
         {"id":"level4","name":"Express (L4)","url":"http://level4:10000","cost":1},
         {"id":"level5","name":"React+Flask (L5)","url":"http://level5:10000","cost":2},
         {"id":"level6","name":"Next.js (L6)","url":"http://level6:10000","cost":3},
         {"id":"level7","name":"Microservices (L7)","url":"http://level7:80","cost":3}]
    ports: ["8080:8073"]
    depends_on:
      - level1
      - level2
      - level3
      - level4
      - level5

  # ======================= AI-СЛОЙ (поверх роутера) =======================
  storefront:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/ai-storefront-GBpVR
    environment:
      BACKEND_URL: http://router:8073
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8070:8070"]
    depends_on: ["router"]

  manager:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/ai-manager-GBpVR
    environment:
      BACKEND_URL: http://router:8073
      POLL_MS: "3600000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8071:8071"]
    depends_on: ["router"]

  search:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/ai-search-GBpVR
    environment:
      BACKEND_URL: http://router:8073
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8072:8072"]
    depends_on: ["router"]

  # ======================= ОБЩИЕ СЕРВИСЫ (профиль commerce) =======================
  auth:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/gateway-router-GBpVR
    profiles: ["commerce"]
    command: ["node", "services/auth-service/server.js"]
    environment:
      PORT: "8091"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-prod}
    ports: ["8091:8091"]

  payment:
    build:
      context: ${REPO:-https://github.com/svend4/daten2.git}#claude/gateway-router-GBpVR
    profiles: ["commerce"]
    command: ["node", "services/payment-service/server.js"]
    environment:
      PORT: "8092"
      PAYMENT_PROVIDER: mock
    ports: ["8092:8092"]

volumes:
  l6-data:
  l7-data:

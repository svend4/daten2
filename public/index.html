<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — contract codegen + CDC</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --border:#e3e6ea; --ink:#1a2028; --soft:#556; --faint:#8791a0;
    --accent:#6a3fb0; --accent-soft:#ece3f7; --ok:#1f7a4d; --bad:#b32424; --code:#12151f; --codeink:#dbe4f0;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#12111a; --surface:#1a1824; --border:#2c2838; --ink:#ece7f3; --soft:#a99fb5; --faint:#7d7391;
    --accent:#b18ce6; --accent-soft:#251c33; --ok:#5cc98c; --bad:#e57373; --code:#0c0b12; --codeink:#cdd6e8;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:900px;margin:0 auto;padding:20px;display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px;flex:1;min-width:180px;font-family:var(--mono);font-size:13px}
  button{padding:9px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  button.ghost{background:var(--accent-soft);color:var(--accent)}
  pre{background:var(--code);color:var(--codeink);border-radius:10px;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.5;max-height:340px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--soft);font-size:12px;text-transform:uppercase}
  .pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px}
  .p-ok{background:var(--accent-soft);color:var(--ok)} .p-bad{background:#f6dede;color:var(--bad)}
  @media (prefers-color-scheme:dark){.p-bad{background:#2a1414}}
  .muted{color:var(--faint);font-size:13px} .mm{font-family:var(--mono);font-size:12px;color:var(--bad)}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">📜</span>
    <h1>Contract codegen + CDC (Pact)</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <h2>Генерация клиента из спецификации</h2>
      <div class="row">
        <button class="ghost" onclick="gen('js')">JS</button>
        <button class="ghost" onclick="gen('python')">Python</button>
        <button class="ghost" onclick="gen('ts-types')">TS-типы</button>
        <span class="muted">Один контракт → типизированные клиенты для всех уровней</span>
      </div>
      <pre id="code" style="margin-top:10px">// выберите язык</pre>
    </div>
    <div class="card">
      <h2>CDC · верификация провайдера против пакта</h2>
      <div class="row"><input id="target" placeholder="http://localhost:8080"><button onclick="verify()">Проверить</button></div>
      <div id="summary" class="muted" style="margin-top:8px"></div>
      <table><thead><tr><th>Взаимодействие</th><th>Статус</th><th>Итог</th><th>Расхождения</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
async function gen(lang){ $('code').textContent='…'; $('code').textContent = await (await fetch('/api/codegen?lang='+lang)).text(); }
async function verify(){
  const target = $('target').value || undefined;
  $('summary').textContent='проверяю…'; $('rows').innerHTML='';
  const d = await (await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target})})).json();
  if(d.error){ $('summary').textContent=d.error; return; }
  $('summary').innerHTML = `<b style="color:${d.ok?'var(--ok)':'var(--bad)'}">${d.ok?'✓ пакт удовлетворён':'✗ пакт НЕ удовлетворён'}</b> — ${d.passed}/${d.total} · ${d.provider}`;
  $('rows').innerHTML = d.results.map(r=>`<tr>
    <td>${r.description}</td><td class="mono">${r.status}${r.statusOk?'':' ✗'}</td>
    <td><span class="pill ${r.ok?'p-ok':'p-bad'}">${r.ok?'OK':'FAIL'}</span></td>
    <td class="mm">${(r.mismatches||[]).map(m=>`${m.path}: ждали ${m.expected}, получили ${m.got}`).join('; ')}</td></tr>`).join('');
}
fetch('/api/health').then(r=>r.json()).then(d=>{ $('target').value=d.target; $('engine').textContent=(d.engine==='llm'?'Claude':'rule-based')+' · '+d.langs.join('/'); });
gen('js');
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — семантический поиск</title>
<style>
  :root{
    --bg:#f6f4f8; --surface:#ffffff; --border:#e6e1ec; --ink:#241f2b; --soft:#5b5366; --faint:#8b8397;
    --accent:#6a3fb0; --accent-soft:#ece3f7; --bot:#efeaf4;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#14111a; --surface:#1c1824; --border:#2f2739; --ink:#ece7f3; --soft:#afa6bd; --faint:#7d7391;
    --accent:#b18ce6; --accent-soft:#251c33; --bot:#241d2e;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:820px;margin:0 auto;padding:22px;display:grid;gap:16px}
  form{display:flex;gap:8px}
  input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);font-size:15px}
  button{padding:12px 18px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:13px;padding:6px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer;font-weight:500}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
  .rank{font-family:var(--mono);font-size:13px;color:var(--faint);min-width:44px}
  .grow{flex:1}
  .name{font-weight:600;font-size:15px}
  .price{font-family:var(--mono);color:var(--soft);font-size:13px}
  .axes{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
  .ax{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .bar{height:6px;border-radius:4px;background:var(--accent-soft);width:120px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .sim{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
  .muted{color:var(--faint);font-size:14px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);margin:6px 0 0}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🔎</span>
    <h1>Семантический поиск по букетам</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <form id="f">
      <input id="q" placeholder="Опишите словами: «с приятным запахом, чтобы долго стояли»" autocomplete="off" autofocus />
      <button type="submit">Найти</button>
    </form>
    <div class="chips">
      <button class="chip" onclick="go('цветы с приятным запахом, которые долго стоят')">аромат + стойкость</button>
      <button class="chip" onclick="go('романтический букет девушке')">романтика</button>
      <button class="chip" onclick="go('что-нибудь недорогое и яркое')">бюджет + яркость</button>
      <button class="chip" onclick="go('нежный букет маме')">нежность</button>
    </div>
    <div id="axes" class="muted"></div>
    <div id="results"></div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const money = (n,c) => Number(n).toFixed(2) + ' ' + (c==='EUR'?'€':(c||'€'));

function card(r, rank){
  const axes = (r.matched||[]).map(a=>`<span class="ax">${a}</span>`).join('');
  const pct = Math.round((r.score||0)*100);
  return `<div class="card">
    <span class="rank">${rank!=null?('#'+rank):''}</span>
    <div class="grow">
      <div class="name">${r.name}${r.is_featured?' ★':''}</div>
      <div class="price">${money(r.price,r.currency)}</div>
      ${axes?`<div class="axes">${axes}</div>`:''}
    </div>
    <div style="text-align:right">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <button class="sim" onclick="similar(${r.id},'${r.name.replace(/'/g,"")}')">похожие →</button>
    </div>
  </div>`;
}

async function go(text){
  $('q').value = text;
  $('results').innerHTML = '<p class="muted">Ищу…</p>'; $('axes').textContent='';
  try{
    const d = await (await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text,top:6})})).json();
    if(d.error){ $('results').innerHTML='<p class="muted">'+d.error+'</p>'; return; }
    const on = Object.entries(d.axes||{}).filter(([,v])=>v>0.05).map(([k])=>k);
    $('axes').textContent = on.length ? ('Оси запроса: '+on.join(', ')) : 'Поиск по названию';
    $('results').innerHTML = '<h2>Результаты</h2>' + (d.results.length ? d.results.map((r,i)=>card(r,i+1)).join('') : '<p class="muted">Ничего не найдено</p>');
  }catch(e){ $('results').innerHTML='<p class="muted">Ошибка сети</p>'; }
}

async function similar(id,name){
  $('results').innerHTML = '<p class="muted">Подбираю похожие…</p>'; $('axes').textContent='';
  try{
    const d = await (await fetch('/api/similar/'+id+'?top=4')).json();
    if(d.error){ $('results').innerHTML='<p class="muted">'+d.error+'</p>'; return; }
    $('results').innerHTML = '<h2>Похожие на «'+name+'»</h2>' + d.results.map(r=>card(r)).join('');
  }catch(e){ $('results').innerHTML='<p class="muted">Ошибка сети</p>'; }
}

$('f').addEventListener('submit',(e)=>{ e.preventDefault(); const v=$('q').value.trim(); if(v) go(v); });
fetch('/api/health').then(r=>r.json()).then(d=>{ $('engine').textContent=(d.engine==='llm'?'Claude API':'rule-based')+' · '+d.indexed+' товаров'; });
</script>
</body>
</html>

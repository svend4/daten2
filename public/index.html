<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — интеграции</title>
<style>
  :root{
    --bg:#f5f6f9; --surface:#fff; --border:#e3e6ef; --ink:#1a2030; --soft:#556; --faint:#8791a4;
    --accent:#4457c4; --accent-soft:#e2e6fb; --ok:#1f7a4d; --real:#8a5a1e; --real-soft:#f3e6d2;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#101320; --surface:#181c2b; --border:#282f45; --ink:#e6eaf5; --soft:#a6afc6; --faint:#767f98;
    --accent:#8a9cf0; --accent-soft:#1b2238; --ok:#5cc98c; --real:#e0af5a; --real-soft:#2a2312;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:820px;margin:0 auto;padding:20px;display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 4px;font-size:14px}
  .prov{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
  .prov.real{background:var(--real-soft);color:var(--real)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  input{padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px}
  input.grow{flex:1;min-width:160px}
  button{padding:9px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .out{margin-top:10px;font-family:var(--mono);font-size:13px;background:var(--accent-soft);border-radius:8px;padding:10px;white-space:pre-wrap}
  .rank{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid var(--border);font-size:14px}
  .muted{color:var(--faint);font-size:13px}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🔌</span>
    <h1>Реальные интеграции · адаптеры</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <h2>💳 Платежи <span class="prov" id="pprov">…</span></h2>
      <div class="muted">Stripe при `STRIPE_SECRET_KEY`, иначе детерминированный mock. Один интерфейс.</div>
      <div class="row">
        <input id="amount" type="number" value="12.50" step="0.5" style="width:100px">
        <input id="cur" value="EUR" style="width:70px">
        <input id="ord" placeholder="orderNumber" value="ORD-1" style="width:120px">
        <button onclick="pay()">Создать + подтвердить</button>
      </div>
      <div class="out" id="pout" style="display:none"></div>
    </div>
    <div class="card">
      <h2>🧭 Эмбеддинги и семантическая близость <span class="prov" id="eprov">…</span></h2>
      <div class="muted">Voyage при `VOYAGE_API_KEY` (у Anthropic нет embeddings-API), иначе mock.</div>
      <div class="row">
        <input id="q" class="grow" placeholder="запрос" value="красные розы для романтики">
        <button onclick="sim()">Ранжировать</button>
      </div>
      <textarea id="docs" style="width:100%;margin-top:8px;min-height:70px;font-family:var(--mono);font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px">красные розы классический букет
жёлтые тюльпаны весенние
офисный степлер</textarea>
      <div id="sout"></div>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
async function pay(){
  const i = await (await fetch('/api/payments/intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:+$('amount').value,currency:$('cur').value,orderNumber:$('ord').value})})).json();
  if(i.error){ $('pout').style.display='block'; $('pout').textContent=i.error; return; }
  const c = await (await fetch('/api/payments/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intentId:i.id})})).json();
  $('pout').style.display='block';
  $('pout').textContent = `intent ${i.id}\nсумма ${i.amount} ${i.currency} · заказ ${i.order_number}\nстатус: ${i.status} → ${c.status} · провайдер ${i.provider}`;
}
async function sim(){
  const docs = $('docs').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const d = await (await fetch('/api/similarity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('q').value,docs})})).json();
  if(d.error){ $('sout').innerHTML='<div class="muted">'+d.error+'</div>'; return; }
  $('sout').innerHTML = '<div class="muted" style="margin-top:10px">Ранжирование по косинусной близости ('+d.provider+'):</div>'+
    d.results.map(r=>`<div class="rank"><span>${r.doc}</span><span class="mono">${r.score}</span></div>`).join('');
}
fetch('/api/providers').then(r=>r.json()).then(d=>{
  $('pprov').textContent=d.payment.name; $('pprov').className='prov'+(d.payment.real?' real':'');
  $('eprov').textContent=d.embeddings.name+' · '+d.embeddings.model; $('eprov').className='prov'+(d.embeddings.real?' real':'');
});
fetch('/api/health').then(r=>r.json()).then(d=>{ $('engine').textContent='payment='+d.payment+' · embed='+d.embeddings; });
</script>
</body>
</html>

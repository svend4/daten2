<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — RAG + память</title>
<style>
  :root{
    --bg:#f4f7f6; --surface:#fff; --border:#e2e8e6; --ink:#182220; --soft:#556; --faint:#8894a0;
    --accent:#1a7f64; --accent-soft:#dbeee8; --bot:#eef3f1; --src:#eef1f8;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1513; --surface:#161d1b; --border:#26302d; --ink:#e6eeeb; --soft:#a6b2ad; --faint:#74827c;
    --accent:#4fc09a; --accent-soft:#15251f; --bot:#1c2624; --src:#1b2233;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:820px;margin:0 auto;padding:20px;display:grid;gap:16px;grid-template-columns:1fr}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,select{padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px}
  button{padding:9px 15px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .chip{font-size:13px;padding:6px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer}
  #log{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto}
  .msg{max-width:85%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;line-height:1.45;font-size:14px}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff}
  .msg.bot{align-self:flex-start;background:var(--bot)}
  .src{align-self:flex-start;font-size:12px;color:var(--faint);background:var(--src);border-radius:10px;padding:6px 10px}
  .rec{display:flex;justify-content:space-between;padding:7px 8px;border-bottom:1px solid var(--border);font-size:14px}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-left:5px}
  .muted{color:var(--faint);font-size:13px}
  form{display:flex;gap:8px}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🧠</span>
    <h1>Консультант с памятью (RAG)</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <h2>Клиент и память</h2>
      <div class="row">
        <label class="muted">ID клиента <input id="cid" value="demo" style="width:90px"></label>
        <label class="muted">Любимое <input id="fav" placeholder="Красная роза" style="width:130px"></label>
        <label class="muted">Повод <input id="occ" placeholder="маме" style="width:90px"></label>
        <label class="muted">Бюджet € <input id="bud" type="number" placeholder="2.5" style="width:70px"></label>
        <button onclick="saveMem()">Запомнить</button>
        <button class="chip" onclick="recommend()">Рекомендации</button>
      </div>
      <div id="mem" class="muted" style="margin-top:8px"></div>
      <div id="recs"></div>
    </div>
    <div class="card">
      <h2>Вопрос по магазину (ответ по базе знаний)</h2>
      <div id="log"></div>
      <div class="row" style="margin:8px 0">
        <button class="chip" onclick="ask('как ухаживать за розами?')">Уход за розами</button>
        <button class="chip" onclick="ask('когда доставка?')">Доставка</button>
        <button class="chip" onclick="ask('что подарить маме?')">Маме</button>
        <button class="chip" onclick="ask('как вернуть повреждённый букет?')">Возврат</button>
      </div>
      <form id="f"><input id="q" placeholder="Спросите про уход, повод, доставку, оплату…" style="flex:1"><button type="submit">➤</button></form>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const cid = () => $('cid').value || 'demo';
const money = (n) => Number(n).toFixed(2)+' €';

async function saveMem(){
  const patch={preferences:{}};
  if($('fav').value) patch.preferences.favorites=[$('fav').value];
  if($('occ').value) patch.preferences.occasions=[$('occ').value];
  if($('bud').value) patch.preferences.budget=+$('bud').value;
  const m=await (await fetch('/api/memory/'+cid(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)})).json();
  showMem(m);
}
function showMem(m){ const p=m.preferences||{}; $('mem').textContent=`Память: любимое [${(p.favorites||[]).join(', ')||'—'}], поводы [${(p.occasions||[]).join(', ')||'—'}], бюджет ${p.budget??'—'}, вопросов ${m.history?m.history.length:0}`; }
async function loadMem(){ showMem(await (await fetch('/api/memory/'+cid())).json()); }

async function recommend(){
  const d=await (await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:cid()})})).json();
  $('recs').innerHTML='<h2 style="margin:12px 0 6px;font-size:12px;color:var(--soft)">РЕКОМЕНДАЦИИ</h2>'+(d.recommendations||[]).map(r=>
    `<div class="rec"><span>${r.name} — ${money(r.price)}${r.reasons.map(x=>`<span class="tag">${x}</span>`).join('')}</span><span class="muted">${r.score}</span></div>`).join('');
}

function add(role,text){ const e=document.createElement('div'); e.className='msg '+role; e.textContent=text; $('log').appendChild(e); $('log').scrollTop=$('log').scrollHeight; return e; }
async function ask(text){
  $('q').value=''; add('user',text); const t=add('bot','…');
  try{ const d=await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:cid(),question:text})})).json();
    t.textContent=d.answer||d.error||'(нет ответа)';
    if(d.sources&&d.sources.length){ const s=document.createElement('div'); s.className='src'; s.textContent='📚 источники: '+d.sources.map(x=>x.topic).join(' · '); $('log').appendChild(s); }
    loadMem();
  }catch(e){ t.textContent='Ошибка сети'; }
}
$('f').addEventListener('submit',(e)=>{ e.preventDefault(); const v=$('q').value.trim(); if(v) ask(v); });
$('cid').addEventListener('change',loadMem);
fetch('/api/health').then(r=>r.json()).then(d=>{ $('engine').textContent=(d.engine==='llm'?'Claude (grounded)':'rule-based')+' · '+d.kb+' док.'; });
loadMem();
</script>
</body>
</html>

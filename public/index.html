<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — Vision</title>
<style>
  :root{
    --bg:#f7f4f7; --surface:#fff; --border:#e7e0ea; --ink:#241f28; --soft:#565; --faint:#8b8397;
    --accent:#b0357a; --accent-soft:#f6e2ee; --bot:#f0eaf3;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#141115; --surface:#1c1820; --border:#302838; --ink:#ece7f0; --soft:#a99fb5; --faint:#7d7391;
    --accent:#e58ab9; --accent-soft:#2a1a24; --bot:#231d2a;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:760px;margin:0 auto;padding:20px;display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--faint);cursor:pointer}
  .drop.hi{border-color:var(--accent);color:var(--accent)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .swatch{width:56px;height:56px;border-radius:10px;border:1px solid var(--border)}
  button{padding:8px 13px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .chip{font-size:12px;padding:6px 10px;border-radius:18px;background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer}
  .tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .rec{display:flex;justify-content:space-between;padding:7px 8px;border-bottom:1px solid var(--border);font-size:14px}
  .muted{color:var(--faint);font-size:13px}
  img.prev{max-width:120px;max-height:120px;border-radius:10px;border:1px solid var(--border)}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">📷</span>
    <h1>Vision · поиск по фото</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <h2>Загрузите фото букета</h2>
      <div class="drop" id="drop">Перетащите изображение сюда или нажмите. Демо-цвета ниже (PNG генерируется в браузере):</div>
      <input type="file" id="file" accept="image/*" style="display:none">
      <div class="row" style="margin-top:10px">
        <button class="chip" onclick="demo(200,30,30)">🔴 красный</button>
        <button class="chip" onclick="demo(220,200,40)">🟡 жёлтый</button>
        <button class="chip" onclick="demo(230,150,180)">🌸 розовый</button>
      </div>
    </div>
    <div class="card" id="result" style="display:none">
      <h2>Анализ</h2>
      <div class="row">
        <img class="prev" id="prev" alt="">
        <div class="swatch" id="sw"></div>
        <div>
          <div id="desc"></div>
          <div class="tags" id="tags"></div>
        </div>
      </div>
      <h2 style="margin-top:16px">Похожие товары в каталоге</h2>
      <div id="recs"></div>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
let curB64 = null, curMime = 'image/png';

function toB64(blob){ return new Promise((res)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); }); }

// генерим сплошной PNG в браузере через canvas
function demo(r,g,b){
  const c=document.createElement('canvas'); c.width=c.height=32; const x=c.getContext('2d');
  x.fillStyle=`rgb(${r},${g},${b})`; x.fillRect(0,0,32,32);
  c.toBlob(async(blob)=>{ curMime='image/png'; const d=await toB64(blob); curB64=d; run(d); }, 'image/png');
}

$('drop').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',async(e)=>{ const f=e.target.files[0]; if(!f)return; curMime=f.type; const d=await toB64(f); curB64=d; run(d); });
['dragover','dragenter'].forEach(ev=>$('drop').addEventListener(ev,(e)=>{e.preventDefault();$('drop').classList.add('hi');}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,(e)=>{e.preventDefault();$('drop').classList.remove('hi');}));
$('drop').addEventListener('drop',async(e)=>{ const f=e.dataTransfer.files[0]; if(!f)return; curMime=f.type; const d=await toB64(f); curB64=d; run(d); });

async function run(dataUrl){
  $('prev').src=dataUrl; $('result').style.display='block';
  $('desc').textContent='анализирую…'; $('tags').innerHTML=''; $('recs').innerHTML='';
  try{
    const a = await (await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:dataUrl,mediaType:curMime})})).json();
    if(a.error){ $('desc').textContent='Не удалось разобрать (для детерминированного движка нужен PNG). '+a.error; return; }
    const c=a.dominant; $('sw').style.background=`rgb(${c.r},${c.g},${c.b})`;
    $('desc').innerHTML = (a.llm&&a.llm.description) ? a.llm.description : a.description;
    const tags=(a.llm&&a.llm.tags)||a.tags||[];
    $('tags').innerHTML = tags.map(t=>`<span class="tag">${t}</span>`).join('');
    const sp = await (await fetch('/api/search-by-photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageBase64:dataUrl})})).json();
    $('recs').innerHTML = (sp.results||[]).map(r=>`<div class="rec"><span>${r.name} — ${r.price.toFixed(2)} €${r.reasons.length?` <span class="tag">${r.reasons[0]}</span>`:''}</span><span class="muted">${r.score}</span></div>`).join('') || '<div class="muted">каталог недоступен</div>';
  }catch(e){ $('desc').textContent='Ошибка сети'; }
}
fetch('/api/health').then(r=>r.json()).then(d=>{ $('engine').textContent=(d.engine==='llm'?'Claude-vision':'цветовое ядро (PNG)')+' · '+d.backend; });
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — ИИ-консультант</title>
<style>
  :root{
    --bg:#f7f3f1; --surface:#fffdfc; --border:#e5dad5; --ink:#241a1d; --soft:#5c4f52; --faint:#8a7c7f;
    --accent:#9d2b52; --accent-soft:#f4e1e8; --bot:#f1eae7;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#171214; --surface:#1f1719; --border:#392c30; --ink:#f2e9ea; --soft:#bcadb1; --faint:#8a7c80;
    --accent:#e88aa8; --accent-soft:#3a2028; --bot:#271e21;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);height:100vh;display:flex;flex-direction:column}
  header{padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:ui-monospace,monospace}
  #log{flex:1;overflow-y:auto;padding:20px;max-width:760px;width:100%;margin:0 auto}
  .msg{display:flex;margin-bottom:14px}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:78%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.45;font-size:15px}
  .user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bot .bubble{background:var(--bot);color:var(--ink);border-bottom-left-radius:4px}
  form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);max-width:760px;width:100%;margin:0 auto}
  input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--ink);font-size:15px}
  button{padding:12px 18px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5}
  .chips{display:flex;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:0 20px 8px}
  .chip{font-size:13px;padding:6px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer;font-weight:500}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🌷</span>
    <h1>ИИ-консультант магазина цветов</h1>
    <span class="badge" id="engine"></span>
  </header>
  <div id="log"></div>
  <div class="chips">
    <button class="chip" onclick="quick('Покажи каталог')">Каталог</button>
    <button class="chip" onclick="quick('Есть рекомендуемые до 2 евро?')">Рекомендуемые до 2 €</button>
    <button class="chip" onclick="quick('Добавьте 2 розы')">+2 розы</button>
    <button class="chip" onclick="quick('Оформить заказ')">Оформить</button>
  </div>
  <form id="f">
    <input id="m" placeholder="Напишите сообщение…" autocomplete="off" autofocus />
    <button id="send" type="submit">➤</button>
  </form>

<script>
const sessionId = 'web-' + Math.random().toString(36).slice(2);
const log = document.getElementById('log');

function add(role, text){
  const m = document.createElement('div'); m.className = 'msg ' + role;
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

async function send(text){
  add('user', text);
  const thinking = add('bot', '…');
  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sessionId, message: text })
    });
    const d = await r.json();
    thinking.textContent = d.reply || d.error || '(нет ответа)';
  }catch(e){ thinking.textContent = 'Ошибка сети'; }
}

function quick(t){ document.getElementById('m').value = ''; send(t); }

document.getElementById('f').addEventListener('submit', (e)=>{
  e.preventDefault();
  const inp = document.getElementById('m');
  const t = inp.value.trim(); if(!t) return; inp.value = ''; send(t);
});

// приветствие + бейдж движка
fetch('/api/health').then(r=>r.json()).then(d=>{
  document.getElementById('engine').textContent = d.engine === 'llm' ? 'Claude API' : 'rule-based';
});
add('bot', 'Здравствуйте! Я помогу выбрать и заказать цветы 🌷 Спросите «покажи каталог» или сразу «добавьте пион».');
</script>
</body>
</html>

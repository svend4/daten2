<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — авто-эвалы</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#fff; --border:#e3e6ea; --ink:#1a2028; --soft:#556; --faint:#8791a0;
    --accent:#2d6a4f; --accent-soft:#dcefe6; --ok:#1f7a4d; --bad:#b32424; --warn:#b3771e;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1416; --surface:#171d20; --border:#28313a; --ink:#e6edf3; --soft:#a6b2bd; --faint:#76828f;
    --accent:#5cc99a; --accent-soft:#152a22; --ok:#5cc98c; --bad:#e57373; --warn:#e0af5a;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:820px;margin:0 auto;padding:20px;display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px}
  button{padding:9px 15px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  button.ghost{background:var(--accent-soft);color:var(--accent)}
  .gauge{display:flex;align-items:center;gap:16px}
  .score{font-size:44px;font-weight:800;font-family:var(--mono)}
  .score.ok{color:var(--ok)} .score.warn{color:var(--warn)} .score.bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--soft);font-size:12px;text-transform:uppercase}
  .pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px}
  .p-ok{background:var(--accent-soft);color:var(--ok)} .p-bad{background:#f6dede;color:var(--bad)}
  @media (prefers-color-scheme:dark){.p-bad{background:#2a1414}}
  .muted{color:var(--faint);font-size:13px}
  .reg{color:var(--bad);font-weight:600}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🧪</span>
    <h1>Авто-эвалы · scorecard</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="gauge"><div class="score" id="score">—</div><div><div id="passed" class="muted"></div><div id="target" class="muted"></div></div></div>
        <div class="row">
          <button onclick="run()">▶ Контрактный прогон</button>
          <button class="ghost" onclick="runBeh()">Поведенческий</button>
          <button class="ghost" onclick="baseline()">Сохранить baseline</button>
        </div>
      </div>
      <div id="compare" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Кейсы</h2>
      <table><thead><tr><th>Кейс</th><th>Вес</th><th>Итог</th><th>Детали</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Запустите прогон</td></tr></tbody></table>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
function render(card){
  const cls = card.score>=90?'ok':(card.score>=60?'warn':'bad');
  $('score').className='score '+cls; $('score').textContent=card.score;
  $('passed').textContent = `пройдено ${card.passed}/${card.total} · набор: ${card.suite}`;
  $('target').textContent = card.target;
  $('rows').innerHTML = card.results.map(r=>`<tr><td>${r.name}</td><td class="mono">${r.weight}</td>
    <td><span class="pill ${r.pass?'p-ok':'p-bad'}">${r.pass?'PASS':'FAIL'}</span></td>
    <td class="muted">${r.detail||''}</td></tr>`).join('');
  if(card.compare && card.compare.hasBaseline){
    const c=card.compare;
    $('compare').innerHTML = c.regressions.length
      ? `<span class="reg">⚠ Регрессии (${c.regressions.length}): ${c.regressions.map(x=>x.name).join(', ')}</span> · Δ ${c.scoreDelta}`
      : `<span style="color:var(--ok)">✓ Регрессий нет</span> · Δ ${c.scoreDelta>=0?'+':''}${c.scoreDelta}${c.fixes.length?' · исправлений '+c.fixes.length:''}`;
  } else $('compare').innerHTML = '<span class="muted">baseline не задан — сохраните текущий прогон для контроля регрессий</span>';
}
async function run(){ $('score').textContent='…'; const d=await (await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json(); if(d.error){$('compare').textContent=d.error;return;} render(d); }
async function runBeh(){ $('score').textContent='…'; const d=await (await fetch('/api/run-behavior',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json(); if(d.error){$('compare').textContent=d.error;return;} render(d); }
async function baseline(){ const d=await (await fetch('/api/baseline',{method:'POST'})).json(); $('compare').innerHTML = d.ok?`<span style="color:var(--ok)">baseline сохранён (балл ${d.baseline})</span>`:d.error; }
fetch('/api/health').then(r=>r.json()).then(d=>{ $('engine').textContent=(d.engine==='llm-judge'?'+ Claude-judge':'rule-based')+' · '+d.target; run(); });
</script>
</body>
</html>

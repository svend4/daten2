<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин цветов — green/FinOps-роутер</title>
<style>
  :root{
    --bg:#f3f7f4; --surface:#fff; --border:#e0e8e2; --ink:#16241c; --soft:#556; --faint:#7f8f85;
    --accent:#1f8a52; --accent-soft:#dcefe2; --good:#1f7a4d; --warn:#b3771e;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e150f; --surface:#151d17; --border:#26332b; --ink:#e4efe8; --soft:#a4b3a9; --faint:#728175;
    --accent:#4fc07a; --accent-soft:#152a1c; --good:#5cc98c; --warn:#e0af5a;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  header{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;margin:0}
  header .badge{font-size:11px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  main{max-width:920px;margin:0 auto;padding:20px;display:grid;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .sld label{font-size:13px;color:var(--soft);display:flex;justify-content:space-between}
  input[type=range]{width:100%}
  .profiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:13px;padding:6px 12px;border-radius:20px;background:var(--accent-soft);color:var(--accent);border:none;cursor:pointer;font-weight:500}
  button{padding:9px 15px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--soft);font-size:12px;text-transform:uppercase}
  .num{font-family:var(--mono)}
  tr.pick{background:var(--accent-soft)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .kpi{background:var(--accent-soft);border-radius:10px;padding:12px}
  .kpi .v{font-size:20px;font-weight:700;font-family:var(--mono)}
  .kpi .l{font-size:12px;color:var(--soft)}
  .muted{color:var(--faint)}
</style>
</head>
<body>
  <header>
    <span style="font-size:22px">🌱</span>
    <h1>Green / FinOps-роутер</h1>
    <span class="badge" id="engine"></span>
  </header>
  <main>
    <div class="card">
      <h2>Веса критериев</h2>
      <div class="sliders" id="sliders"></div>
      <div class="profiles">
        <span class="muted" style="align-self:center">Профили:</span>
        <button class="chip" onclick="profile(1,0,0,0)">⚡ Быстро</button>
        <button class="chip" onclick="profile(0,1,0,0)">💶 Дёшево</button>
        <button class="chip" onclick="profile(0,0,1,0)">🌱 Зелено</button>
        <button class="chip" onclick="profile(.4,.3,.2,.1)">⚖ Баланс</button>
        <button onclick="fire(20)">▶ 20 запросов</button>
      </div>
    </div>
    <div class="card">
      <h2>Выбор уровня (композитная стоимость)</h2>
      <table><thead><tr><th>Уровень</th><th>Композит</th><th>Латентность</th><th>€/запрос</th><th>мг CO2</th><th>Надёжн.</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div class="card">
      <h2>FinOps (накоплено)</h2>
      <div class="kpis" id="finops"></div>
    </div>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const AX = [['latency','латентность'],['cost','стоимость'],['carbon','углерод'],['reliability','надёжность']];
let W = {latency:0.4,cost:0.3,carbon:0.2,reliability:0.1};

function drawSliders(){
  $('sliders').innerHTML = AX.map(([k,l])=>`<div class="sld"><label>${l}<span class="num" id="v_${k}">${W[k]}</span></label>
    <input type="range" min="0" max="1" step="0.05" value="${W[k]}" oninput="setW('${k}',this.value)"></div>`).join('');
}
async function setW(k,v){ W[k]=+v; $('v_'+k).textContent=(+v).toFixed(2); await push(); }
async function profile(l,c,g,r){ W={latency:l,cost:c,carbon:g,reliability:r}; drawSliders(); await push(); }
async function push(){ await fetch('/api/weights',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(W)}); refresh(); }

async function refresh(){
  const d = await (await fetch('/api/router/stats')).json();
  const choice = d.decision.choice;
  $('rows').innerHTML = d.decision.scored.map(s=>`<tr class="${s.id===choice?'pick':''}">
    <td>${s.name}${s.id===choice?' ◀':''} ${s.alive?'':'<span class="muted">(offline)</span>'}</td>
    <td class="num">${s.composite}</td><td class="num">${s.latencyMs} мс</td>
    <td class="num">€${s.costEur.toFixed(4)}</td><td class="num">${s.co2mg}</td><td class="num">${Math.round(s.success*100)}%</td></tr>`).join('');
  const f = d.finops.total;
  $('finops').innerHTML = [
    ['Запросов', f.req],['Потрачено', '€'+f.costEur.toFixed(4)],
    ['Энергия', f.energyWh+' Вт·ч'],['Выбросы', f.co2g+' г CO2'],
  ].map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
}
async function fire(n){ for(let i=0;i<n;i++) await fetch('/api/products'); refresh(); }

fetch('/api/health').then(r=>r.json()).then(d=>{ W=d.weights||W; drawSliders(); $('engine').textContent=(d.engine==='llm'?'Claude':'rule-based')+' · '+d.backends+' уровней'; refresh(); });
</script>
</body>
</html>

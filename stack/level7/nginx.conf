# API-gateway L7 для единого стенда: только контракт (/api/*), без frontend-маршрута,
# чтобы уровень поднимался как «живой бэкенд» за роутером без витрины L7.
# Монтируется как /etc/nginx/conf.d/default.conf.

upstream product_service { server product-service:3001; }
upstream order_service   { server order-service:8000; }

server {
    listen 80;

    location = /api/health {
        proxy_pass http://product_service;
        proxy_set_header Host $host;
    }
    location /api/products {
        proxy_pass http://product_service;
        proxy_set_header Host $host;
    }
    location /api/orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
    }
}

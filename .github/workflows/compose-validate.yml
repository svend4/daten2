name: validate docker-compose

on:
  push:
    branches: [ "claude/flower-shop-seven-levels-GBpVR" ]
  pull_request:
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose version
        run: docker compose version

      - name: Validate base compose (default profile)
        run: docker compose config --quiet

      - name: Validate every profile combination
        run: |
          set -e
          for p in full enterprise commerce; do
            echo "== profile: $p =="
            docker compose --profile "$p" config --quiet
          done
          echo "== all profiles together =="
          docker compose --profile full --profile enterprise --profile commerce config --quiet

      - name: Assert default services are exactly L1-L5 + router + AI layer
        run: |
          set -e
          expected="autonomous distillation evals firewall green-router level1 level2 level3 level4 level5 manager market observability rag router search storefront twin vision"
          actual="$(docker compose config --services | sort | tr '\n' ' ' | sed 's/ *$//')"
          echo "default services: $actual"
          [ "$actual" = "$expected" ] || { echo "::error::default service set changed (got: $actual)"; exit 1; }

      - name: Assert full set has all 30 services
        run: |
          set -e
          count="$(docker compose --profile full --profile enterprise --profile commerce config --services | wc -l | tr -d ' ')"
          echo "total services: $count"
          [ "$count" = "30" ] || { echo "::error::expected 30 services, got $count"; exit 1; }

      - name: Assert L7 mount files exist
        run: |
          set -e
          test -f stack/level7/nginx.conf
          test -f stack/level7/db-init.sql
          echo "L7 mount files present"

name: smoke (Capability Router)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check server.js
          node --check registry.js
          node --check services/auth-service/server.js
          node --check services/payment-service/server.js
      - name: Smoke test (mock backend + routing)
        run: npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Contract test against reference backend
        run: |
          node contract-test/mock-backend.mjs & sleep 1
          BACKEND_URL=http://localhost:8100 node contract-test/run.mjs

name: smoke (L3 · Django)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test
      DEBUG: 'true'
      ALLOWED_HOSTS: testserver
      DJANGO_SETTINGS_MODULE: flower_shop.settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: System check
        run: python manage.py check

      - name: Migrate (creates schema + seed)
        run: python manage.py migrate --noinput

      - name: Catalog + order via test client (rich schema)
        run: |
          python - <<'PY'
          import django; django.setup()
          from django.test import Client
          from shop.models import Product, Order, OrderStatusHistory
          c = Client()
          assert c.get('/').status_code == 200, 'каталог'
          assert 'Красная роза' in c.get('/').content.decode(), 'сид виден'
          pid = Product.objects.first().id
          assert c.post(f'/order/{pid}/', {'name': 'CI', 'phone': '0'}).status_code == 302, 'заказ'
          o = Order.objects.get()
          assert len(o.order_number) == 32, 'order_number токен'
          assert o.payment_status == 'pending', 'payment_status'
          assert o.items.first().line_total == o.total_amount, 'снимок позиции'
          assert OrderStatusHistory.objects.count() == 1, 'история статусов'
          # единый JSON API-контракт
          import json
          assert c.get('/api/health').json()['level'] == 3, 'health'
          assert isinstance(c.get('/api/products').json(), list), 'api products'
          ro = c.post('/api/orders', data=json.dumps({'name':'CI','phone':'0','items':[{'product_id':pid,'quantity':1}]}), content_type='application/json')
          assert ro.status_code == 201, 'api create order'
          tok = ro.json()['order_number']
          assert c.get(f'/api/orders/{tok}').json()['order']['payment_status'] == 'pending', 'api get order'
          print('Каталог + богатая схема + единый API OK ✓')
          PY

      - name: Admin (ensure_admin + login)
        run: |
          ADMIN_USERNAME=admin ADMIN_PASSWORD=ci-admin-pass python manage.py ensure_admin
          python - <<'PY2'
          import django; django.setup()
          from django.test import Client
          c = Client()
          assert c.login(username='admin', password='ci-admin-pass'), 'admin login'
          assert c.get('/admin/shop/order/').status_code == 200, 'admin orders'
          assert c.get('/admin/shop/product/').status_code == 200, 'admin products'
          print('Админка OK ✓')
          PY2

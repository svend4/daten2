name: smoke (L4 · Express)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Syntax check
        run: |
          node --check server.js
          node --check app.js
          node --check init_db.js

      - name: Boot server and check catalog + rich order flow
        run: |
          PORT=3000 node server.js >/tmp/node.log 2>&1 &
          sleep 4
          curl -fsS http://127.0.0.1:3000/ | grep -qi "цвет"
          echo "Каталог отдаётся ✓"
          # PRG: POST -> 302 на /order/<order_number> (непубличный токен)
          LOC=$(curl -s -o /dev/null -w "%{redirect_url}" -X POST \
            -d "name=CI&phone=0&product_id=1&quantity=1" http://127.0.0.1:3000/order)
          echo "$LOC" | grep -qE "/order/[0-9a-f]{32}"
          curl -fsS "$LOC" | grep -q "принят"
          echo "Богатый поток заказа OK ✓"
          # единый JSON API-контракт
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"level":4'
          curl -fsS http://127.0.0.1:3000/api/products | grep -q "category_name"
          TOK=$(curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"name":"CI","phone":"0","items":[{"product_id":1,"quantity":1}]}' \
            http://127.0.0.1:3000/api/orders | grep -oE '[0-9a-f]{32}')
          curl -fsS "http://127.0.0.1:3000/api/orders/$TOK" | grep -q '"payment_status":"pending"'
          echo "Единый API OK ✓"

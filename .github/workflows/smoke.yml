name: smoke (L7 · Microservices)

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose -f docker-compose.local.yml config >/dev/null && echo "compose OK ✓"

      - name: Validate nginx gateway config
        run: |
          printf 'events{}\nhttp{\n  include /cfg/default.conf;\n}\n' > /tmp/main.conf
          docker run --rm \
            -v "$PWD/api-gateway/nginx.conf:/cfg/default.conf:ro" \
            -v /tmp/main.conf:/etc/nginx/nginx.conf:ro \
            nginx:alpine nginx -t
          echo "nginx config OK ✓"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Product-service syntax
        run: node --check services/product-service/server.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python services syntax
        run: |
          python -m py_compile services/order-service/app.py
          python -m py_compile services/notification-service/worker.py
          echo "services OK ✓"

      - name: Assert gateway/service port alignment
        run: |
          grep -q "product-service:3001" api-gateway/nginx.conf
          grep -q "order-service:8000" api-gateway/nginx.conf
          grep -q "PORT: 3001" docker-compose.local.yml
          grep -q "PORT: 8000" docker-compose.local.yml
          echo "Порты gateway↔сервисы согласованы ✓"

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flower_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Load canonical schema (db/init.sql)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d flower_shop -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Verify rich order flow on Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d flower_shop -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO customers (name, phone) VALUES ('CI','0') RETURNING id \gset c_
          INSERT INTO orders (order_number, customer_id, subtotal, total_amount, delivery_address)
            VALUES ('citoken00000000000000000000000000', :c_id, 1.50, 1.50, 'x') RETURNING id \gset o_
          INSERT INTO order_items (order_id, product_id, product_name, quantity, unit_price, line_total)
            VALUES (:o_id, 1, 'Красная роза', 1, 1.50, 1.50);
          INSERT INTO order_status_history (order_id, status, note) VALUES (:o_id, 'new', 'Заказ создан');
          SQL
          echo "init.sql + богатый поток заказа OK ✓"

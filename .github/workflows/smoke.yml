name: smoke (Capability Router)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check server.js
          node --check registry.js
      - name: Smoke test (mock backend + routing)
        run: npm test

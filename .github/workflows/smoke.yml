name: smoke (L1 · PHP)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3

      - name: Lint PHP
        run: |
          php -l index.php
          php -l init_db.php

      - name: Build DB from canonical schema
        run: php init_db.php

      - name: Boot server and check catalog + rich order + API
        run: |
          php -S 127.0.0.1:8000 index.php >/tmp/php.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/ | grep -q "Магазин цветов"
          echo "Каталог отдаётся ✓"
          curl -fsS -X POST \
            -d "action=order&name=CI&phone=0&email=a@b.c&address=x&product_id=1&quantity=1" \
            http://127.0.0.1:8000/ | grep -q "оформлен"
          echo "Заказ (форма) оформляется ✓"
          # единый JSON API-контракт
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"level":1'
          curl -fsS http://127.0.0.1:8000/api/products | grep -q "category_name"
          TOK=$(curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"name":"CI","phone":"0","items":[{"product_id":1,"quantity":1}]}' \
            http://127.0.0.1:8000/api/orders | grep -oE '[0-9a-f]{32}')
          curl -fsS "http://127.0.0.1:8000/api/orders/$TOK" | grep -q '"payment_status":"pending"'
          echo "Единый API OK ✓"

      - name: Assert rich schema invariants
        run: |
          php -r '
            $db = new SQLite3("flowers.db");
            $c = $db->query("SELECT COUNT(*) c FROM customers")->fetchArray()["c"];
            $on = $db->query("SELECT order_number FROM orders LIMIT 1")->fetchArray()["order_number"];
            $h = $db->query("SELECT COUNT(*) c FROM order_status_history")->fetchArray()["c"];
            if ($c < 1 || strlen($on) !== 32 || $h < 1) { fwrite(STDERR, "schema invariants failed\n"); exit(1); }
            echo "Богатая схема OK ✓\n";
          '

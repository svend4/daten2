name: smoke (L2 · Flask)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build DB from canonical schema
        run: python init_db.py

      - name: Boot app and exercise routes (rich schema)
        env:
          SECRET_KEY: ci-test
        run: |
          python - <<'PY'
          from app import app
          app.config['TESTING'] = True
          c = app.test_client()
          assert c.get('/').status_code == 200, 'каталог'
          assert c.get('/?search=роза').status_code == 200, 'поиск'
          assert c.get('/product/1').status_code == 200, 'товар'
          assert c.post('/cart/add/1', data={'quantity': '1'}).status_code == 302, 'в корзину'
          assert c.get('/cart').status_code == 200, 'корзина'
          r = c.post('/checkout', data={'name': 'CI', 'phone': '0', 'email': 'a@b.c', 'address': '—'},
                     follow_redirects=True)
          assert r.status_code == 200, 'оформление'
          # проверяем богатую схему: отдельный customer + токен заказа + история статусов
          import sqlite3
          db = sqlite3.connect('flowers.db')
          assert db.execute('SELECT COUNT(*) FROM customers').fetchone()[0] == 1, 'customer'
          assert db.execute('SELECT order_number FROM orders').fetchone()[0], 'order_number'
          assert db.execute('SELECT COUNT(*) FROM order_status_history').fetchone()[0] == 1, 'history'
          print('Маршруты + богатая схема OK ✓')
          PY

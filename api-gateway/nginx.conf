# Монтируется как /etc/nginx/conf.d/default.conf (внутри http{} основного конфига),
# поэтому здесь только upstream/server, без обёртки events{}/http{}.

upstream product_service { server product-service:3001; }
upstream order_service   { server order-service:8000; }

server {
    listen 80;

    # Порты upstream совпадают с PORT сервисов в docker-compose (3001 / 8000).
    location /api/products {
        proxy_pass http://product_service;
        proxy_set_header Host $host;
    }
    location /api/orders {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }
}
